name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        skill: [annotate-markdown, annotate-markdown-cn]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/${{ matrix.skill }}/package-lock.json
      - run: npm ci --prefix skills/${{ matrix.skill }} --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix skills/${{ matrix.skill }}
